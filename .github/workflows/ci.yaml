name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  spell-check:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v7
        with:
          config: cspell.json
          files: |
            **/*.md
            **/*.dart
            **/*.yaml
            **/*.sh
          incremental_files_only: false

  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart run melos run format

      - name: Dependency rules
        run: dart run melos run deps

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
