name: dartlane_workspace
description: Dartlane monorepo. Release automation for Flutter and Dart, written in Dart.
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/dartlane_core
  - packages/dartlane_flutter
  - packages/dartlane_firebase
  - packages/dartlane
dev_dependencies:
  melos: ^8.9.0
  very_good_analysis: ^10.3.0

melos:
  repository: https://github.com/AbhijithKonnayil/dartlane
  command:
    version:
      # Versions and changelogs are derived from Conventional Commits.
      workspaceChangelog: false
  scripts:
    analyze:
      description: Analyze every package.
      exec: dart analyze --fatal-infos
    test:
      description: Run tests in every package that has a test directory.
      exec: dart test
      packageFilters:
        dirExists: test
    format:
      description: Check formatting in every package.
      exec: dart format --set-exit-if-changed .
    fix:
      description: Apply automatic fixes (dart fix) and format every package.
      exec: dart fix --apply && dart format .
    generate:
      description: Regenerate generated code (the dartlane init templates).
      run: dart run packages/dartlane/tool/generate_templates.dart
    example:reset:
      description: Recreate the example app's dartlane/ folder with dartlane init.
      run: dart run tool/reset_example.dart
    deps:
      description: Enforce workspace dependency rules (no path deps, no cycles).
      run: ./tool/check_dependencies.sh
    check:
      description: Format check, deps rules, analyze and test.
      steps:
        - format
        - deps
        - analyze
        - test
